name: Validate skill helpers
on: [push, pull_request]
permissions:
  contents: read
jobs:
  helpers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/render_week.py validate examples/week-01.json
      - run: python scripts/render_week.py render examples/week-01.json --out examples/week-01.html
      - run: python scripts/render_week.py validate examples/finance/week-01.json
      - run: python scripts/render_week.py render examples/finance/week-01.json --out examples/finance/week-01.html
      - run: python scripts/make_release.py --out dist
